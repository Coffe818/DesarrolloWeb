<!-- Navbar Desktop -->
<nav class="navbar navbar-expand-lg bg-body border-bottom sticky-top">
  <div class="container-fluid">
    <!-- Logo (Izquierda) -->
    <a class="navbar-brand" href="#">VARK Personality</a>

    <!-- Botón Mobile (abre Offcanvas) -->
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido Desktop -->
    <div class="collapse navbar-collapse">
      <!-- Menú Central/Derecha (MD: 106-111) -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Test VARK</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Test Personalidad</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Resultados</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
      </ul>

      <!-- Acciones Derecha (Toggle + Login) -->
      <div class="d-flex align-items-center gap-2">
        <!-- Toggle Dark/Light Mode -->
        <button class="btn btn-sm" 
                [class]="isDarkMode() ? 'btn-outline-light' : 'btn-outline-dark'" 
                (click)="ToggleTheme()">
          @if (isDarkMode()) {
            ☀️ Light
          } @else {
            🌙 Dark
          }
        </button>

        <!-- Botón Iniciar Sesión (Placeholder) -->
        <a href="#" class="btn btn-primary">Iniciar Sesión</a>
        
        <!-- Aquí iría el Avatar + Dropdown si está logueado -->
      </div>
    </div>
  </div>
</nav>

<!-- Offcanvas para Mobile (Barra Lateral) -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menú</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link active" href="#" data-bs-dismiss="offcanvas">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">Test VARK</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">Test Personalidad</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">Resultados</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-bs-dismiss="offcanvas">Contacto</a></li>
    </ul>
    <hr>
    <!-- Toggle Dark/Light Mode (Mobile) -->
    <button class="btn w-100 mb-3" 
            [class]="isDarkMode() ? 'btn-dark' : 'btn-light'" 
            (click)="ToggleTheme()">
      @if (isDarkMode()) {
        ☀️ Cambiar a Light Mode
      } @else {
        🌙 Cambiar a Dark Mode
      }
    </button>
    <!-- Botón Iniciar Sesión (Mobile) -->
    <a href="#" class="btn btn-primary w-100" data-bs-dismiss="offcanvas">Iniciar Sesión</a>
  </div>
</div>
