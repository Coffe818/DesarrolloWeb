<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-sm border-0 w-100" style="max-width: 75vw">
    @if (esLogin()) {
      <div class="card-body p-4 p-md-5">
        <h2 class="mb-5 fw-bold text-center lh-base">Iniciar Sesión</h2>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Ingresá tu email"
            [(ngModel)]="user.email"
            name="email"
            required
          />
        </div>

        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            class="form-control"
            id="password"
            placeholder="Ingresá tu contraseña"
            [(ngModel)]="user.contrasena"
            name="password"
            required
          />
          <button
            class="btn btn-outline-secondary d-flex align-items-center"
            type="button"
            (click)="togglePassword()"
          >
            <span class="material-icons">{{
              passwordVisible() ? 'visibility_off' : 'visibility'
            }}</span>
          </button>
        </div>

        <div class="d-grid mt-4 gap-3">
          <button type="submit" class="btn btn-primary btn-lg py-2 shadow fw-bold" (click)="logIn()">Entrar</button>

          <a  class="btn btn-link text-decoration-none text-center" (click)="toggleLogin()">
            ¿No tienes cuenta? Regístrate aquí
          </a>
        </div>
      </div>
    } @else {
      <div class="card-body p-4 p-md-5">
        <h2 class="mb-5 fw-bold text-center lh-base">Crear Cuenta</h2>

        <div class="mb-3">
          <label for="nombre" class="form-label fw-semibold">Nombre</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Ingresá tu nombre"
            [(ngModel)]="user.nombre"
            name="nombre"
            required
          />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Ingresá tu email"
            [(ngModel)]="user.email"
            name="email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="grupo" class="form-label fw-semibold">Grupo</label>
          <select
            class="form-select"
            id="grupo"
            [(ngModel)]="user.grupo"
            name="grupo"
            required
          >
            <option value="" disabled selected>Selecciona tu grupo</option>
            <option value="PRIMARIA">Primaria</option>
            <option value="SECUNDARIA">Secundaria</option>
            <option value="PREPA">Preparatoria</option>
            <option value="LICENCIATURA">Licenciatura</option>
            <option value="MAESTRIA">Maestría</option>
            <option value="DOCTORADO">Doctorado</option>
          </select>
        </div>


        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <div class="input-group">
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            class="form-control"
            id="password"
            placeholder="Ingresá tu contraseña"
            [(ngModel)]="user.contrasena"
            name="password"
            required
          />

          <button
            class="btn btn-outline-secondary d-flex align-items-center"
            type="button"
            (click)="togglePassword()"
          >
            <span class="material-icons">{{
              passwordVisible() ? 'visibility_off' : 'visibility'
            }}</span>
          </button>
        </div>

        <div class="d-grid mt-4 gap-3">
          <button type="submit" class="btn btn-primary btn-lg py-2 shadow fw-bold" (click)="createAccount()">Crear Cuenta</button>

          <a  class="btn btn-link text-decoration-none text-center" (click)="toggleLogin()">
            ¿No tienes cuenta? Regístrate aquí
          </a>
        </div>
      </div>
    }
  </div>
</div>
